# Site settings
title: "Aschwin's Resume"
description: "Read all about my work experience, education, skills, and interests."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Aschwin F. Schilperoort"
resume_title:                   "Senior Data Scientist"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "aschwin.schilperoort@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "015-2799111"
resume_contact_address:         "Alexander Fleminglaan 1, 2613 AX Delft"

resume_header_contact_info:     "Alexander Fleminglaan 1, 2613 AX Delft • 015-2799111 • aschwin.schilperoort@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>Data scientist with 7+ years of experience applying machine learning and data engineering to food fermentation R&D. Proven track record of delivering business impact through Bayesian optimization, automation, and FAIR data systems, including the design of award-winning starter culture products generating multi-million revenue. Experienced in building and leading teams, scaling data infrastructure, and connecting research with commercial outcomes.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
